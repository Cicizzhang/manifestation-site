<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manifest</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f3ee;
      font-family: Georgia, serif;
      color: #292524;
    }

    .hero {
      text-align: center;
      padding: 40px;
    }

    h1 {
      font-size: 64px;
      font-weight: 400;
      margin-bottom: 16px;
    }

    p {
      font-size: 20px;
      color: #78716c;
    }

    button {
      margin-top: 24px;
      padding: 14px 28px;
      border: 1px solid #292524;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #292524;
      color: white;
    }
  </style>
</head>

<body>

  <main class="hero">
    <h1>Manifest.</h1>
    <p>What you assume, you become.</p>
    <button>Explore</button>
  </main>

</body>
</html>
